<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2진수 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f1ff; --ink:#1d2a4d; --muted:#5b6b94; --panel:#ffffff;
  --front:#fffdf5; --dot:#ff6b4a; --back1:#3b4fd8; --back2:#2c3ccb; --back-ink:#b9c4ff;
  --accent:#ffc93c; --line:#cfdcff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121936; --ink:#eef2ff; --muted:#9aa8d8; --panel:#1c2550;
    --front:#fff6d6; --dot:#ff6b4a; --back1:#4a5df0; --back2:#3547dd; --back-ink:#c9d1ff; --line:#2c3a73;
  }
}
:root[data-theme="dark"]{
  --bg:#121936; --ink:#eef2ff; --muted:#9aa8d8; --panel:#1c2550;
  --front:#fff6d6; --dot:#ff6b4a; --back1:#4a5df0; --back2:#3547dd; --back-ink:#c9d1ff; --line:#2c3a73;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  min-height:100%; padding:20px 14px 36px;
}
main{max-width:760px;margin:0 auto}
h1{font-size:clamp(26px,6vw,36px);margin:4px 0 6px;font-weight:400}
.sub{margin:0 0 22px;color:var(--muted);font-size:clamp(15px,3.6vw,18px);line-height:1.5}

.cards{display:grid;grid-template-columns:repeat(5,minmax(56px,1fr));gap:clamp(6px,2vw,16px);overflow-x:auto;padding:8px 8px 14px;margin:0 -8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.val{font-size:clamp(20px,5vw,30px)}
.card{
  all:unset; cursor:pointer; width:100%; aspect-ratio:3/4.4;
  perspective:800px; border-radius:14px;
}
.card:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.inner{
  position:relative; width:100%; height:100%;
  transform-style:preserve-3d; transform:rotateY(180deg);
  transition:transform .5s cubic-bezier(.3,1.3,.5,1);
}
.card[aria-pressed="true"] .inner{transform:rotateY(0deg)}
.face{
  position:absolute; inset:0; border-radius:14px;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 rgba(20,30,80,.25);
}
.front{background:var(--front);border:3px solid var(--ink);padding:10%}
.back{
  transform:rotateY(180deg); border:3px solid var(--ink);
  background:repeating-linear-gradient(45deg,var(--back1) 0 8px,var(--back2) 8px 16px);
  color:var(--back-ink); font-size:clamp(20px,5vw,30px);
}
.dots{display:grid;gap:clamp(3px,1vw,7px);width:100%;justify-items:center;align-content:center}
.dot{width:100%;max-width:22px;aspect-ratio:1;border-radius:50%;background:var(--dot);border:2px solid var(--ink)}
.bit{font-size:clamp(22px,6vw,34px);min-height:1.2em}
.bit.on{color:var(--dot)}

.panel{
  margin-top:22px;background:var(--panel);border:3px solid var(--ink);border-radius:18px;
  padding:18px 16px;display:grid;gap:16px;
}
.row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.label{color:var(--muted);font-size:clamp(14px,3.5vw,17px);min-width:5.5em}
.big{font-size:clamp(34px,10vw,56px);line-height:1.1;letter-spacing:.06em}
.big small{font-size:.38em;letter-spacing:0;color:var(--muted);margin-left:4px}
.eq{font-size:clamp(17px,4.4vw,24px);color:var(--muted);overflow-wrap:anywhere}
.eq b{color:var(--ink);font-weight:400}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{
  all:unset; cursor:pointer; background:var(--accent); color:#1d2a4d;
  border:3px solid var(--ink); border-radius:12px; padding:8px 18px;
  font-size:clamp(16px,4vw,19px); box-shadow:0 4px 0 rgba(20,30,80,.3);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,30,80,.3)}
.btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tip{margin:16px 0 0;color:var(--muted);font-size:clamp(14px,3.5vw,16px);line-height:1.6}
.info{display:flex;flex-wrap:wrap;gap:8px 10px;margin:0 0 12px}
.chip{background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-size:clamp(15px,3.8vw,18px);line-height:1.4}
.chip b{font-weight:400;color:var(--dot);font-size:1.15em}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.status{font-size:clamp(18px,4.6vw,24px)}
.panel.win{background:var(--accent);color:#1d2a4d}
.panel.win .label,.panel.win .eq,.panel.win small{color:#3a4770}
.panel.win .eq b{color:#1d2a4d}
.game{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 18px}
.game .time{min-width:7.5em}
.result{display:none;text-align:center;background:var(--panel);border:3px solid var(--ink);border-radius:18px;padding:26px 16px 24px;margin-top:6px}
main.done .result{display:block}
main.done .game,main.done .info,main.done .tools,main.done .cards,main.done .panel,main.done .btns,main.done .tip{display:none}
.rl{margin:0;font-size:clamp(18px,4.6vw,24px);color:var(--muted)}
.rtime{font-size:clamp(56px,19vw,128px);line-height:1.15;color:var(--dot);margin:10px 0 6px;overflow-wrap:anywhere}
.rsub{margin:0 0 20px;color:var(--muted);font-size:clamp(14px,3.5vw,17px);line-height:1.6}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<main id="app">
  <h1>2진수 카드</h1>
  <p class="sub">카드를 눌러 뒤집어 보세요. 점이 보이면 1, 뒷면이면 0이에요. 게임 시작을 누르면 5문제에 도전해요!</p>

  <div class="game">
    <div class="chip" id="gProgress"></div>
    <div class="chip time" id="gTime">⏱ 0.0초</div>
    <button class="btn" id="start" type="button">게임 시작</button>
  </div>
  <section class="result" id="result" aria-live="polite">
    <p class="rl">게임 끝! 5문제를 모두 풀었어요</p>
    <div class="rtime" id="rtime"></div>
    <p class="rsub" id="rsub"></p>
    <button class="btn" id="again" type="button">다시 하기</button>
  </section>
  <div class="info">
    <div class="chip" id="chipCount"></div>
    <div class="chip" id="chipMax"></div>
  </div>
  <div class="tools">
    <button class="btn" id="add" type="button">카드 추가 +</button>
    <button class="btn" id="remove" type="button">카드 빼기 -</button>
  </div>
  <div class="cards" id="cards"></div>

  <section class="panel" id="panel" aria-live="polite">
    <div class="row">
      <span class="label">목표 숫자</span>
      <span class="big" id="target">0</span>
      <span class="status" id="status"></span>
    </div>
    <div class="row">
      <span class="label">2진수</span>
      <span class="big" id="bin">00000<small>(2)</small></span>
    </div>
    <div class="row">
      <span class="label">10진수</span>
      <span class="big" id="dec">0<small>(10)</small></span>
    </div>
    <div class="row">
      <span class="label">계산</span>
      <span class="eq" id="eq">앞면인 카드가 없어요</span>
    </div>
  </section>

  <div class="btns">
    <button class="btn" id="reset" type="button">모두 뒤집기(0)</button>
    <button class="btn" id="random" type="button">무작위 카드</button>
    <button class="btn" id="newTarget" type="button">새 목표</button>
  </div>
  <p class="tip">카드를 추가하면 왼쪽에 2배 값의 카드가 생겨요. 점의 개수가 곧 카드의 값이에요. 앞면인 카드의 점을 모두 더하면 10진수가 되고, 카드의 앞면은 1, 뒷면은 0으로 적으면 2진수가 돼요.</p>
</main>

<script>
(function(){
  var MIN=1, MAX=10;
  var state=[0,0,0,0,0];            // 왼쪽(큰 카드) → 오른쪽(1)
  var target=1;
  var wrap=document.getElementById('cards');
  var cardEls=[], bitEls=[], values=[];
  var TOTAL=5, game={mode:'idle',id:0,q:0,t0:0,qStart:0,times:[],timer:null,locked:false};

  function maxVal(){return Math.pow(2,state.length)-1;}
  function colsFor(v){ if(v<=2) return 1; if(v<=8) return 2; if(v<=32) return 4; if(v<=128) return 8; return 16; }

  function build(){
    wrap.innerHTML=''; cardEls=[]; bitEls=[]; values=[];
    var n=state.length;
    wrap.style.gridTemplateColumns='repeat('+n+',minmax(56px,1fr))';
    state.forEach(function(_,i){
      var v=Math.pow(2,n-1-i); values.push(v);
      var slot=document.createElement('div'); slot.className='slot';
      var val=document.createElement('div'); val.className='val'; val.textContent=v;

      var btn=document.createElement('button'); btn.type='button'; btn.className='card';
      var inner=document.createElement('div'); inner.className='inner';
      var front=document.createElement('div'); front.className='face front';
      var dots=document.createElement('div'); dots.className='dots';
      dots.style.gridTemplateColumns='repeat('+colsFor(v)+',1fr)';
      if(v>=32) dots.style.gap='2px';
      for(var d=0;d<v;d++){var dot=document.createElement('span'); dot.className='dot'; dots.appendChild(dot);}
      front.appendChild(dots);
      var back=document.createElement('div'); back.className='face back'; back.textContent='?';
      inner.appendChild(front); inner.appendChild(back); btn.appendChild(inner);

      var bit=document.createElement('div'); bit.className='bit'; bit.textContent='0';
      btn.addEventListener('click',function(){if(game.locked||game.mode==='done') return; state[i]=state[i]?0:1; render();});
      slot.appendChild(val); slot.appendChild(btn); slot.appendChild(bit);
      wrap.appendChild(slot);
      cardEls.push(btn); bitEls.push(bit);
    });
  }

  function newTarget(){
    var max=maxVal(), t;
    do { t=1+Math.floor(Math.random()*max); } while(max>1 && t===target);
    target=t;
  }

  function render(){
    var n=state.length, max=maxVal(), sum=0, parts=[];
    state.forEach(function(s,i){
      cardEls[i].setAttribute('aria-pressed',s?'true':'false');
      cardEls[i].setAttribute('aria-label',values[i]+' 카드, '+(s?'앞면(1)':'뒷면(0)'));
      bitEls[i].textContent=s; bitEls[i].className='bit'+(s?' on':'');
      if(s){sum+=values[i]; parts.push(values[i]);}
    });
    document.getElementById('chipCount').innerHTML='카드 <b>'+n+'장</b> (비트 수 '+n+')';
    document.getElementById('chipMax').innerHTML='가장 큰 수 <b>'+max+'</b> = 2<sup>'+n+'</sup> − 1 = '+new Array(n+1).join('1')+'<small>(2)</small>';
    document.getElementById('bin').innerHTML=state.join('')+'<small>(2)</small>';
    document.getElementById('dec').innerHTML=sum+'<small>(10)</small>';
    document.getElementById('eq').innerHTML=parts.length
      ? parts.join(' + ')+' = <b>'+sum+'</b>'
      : '앞면인 카드가 없어요';
    document.getElementById('target').innerHTML=target+'<small>(1 ~ '+max+')</small>';
    var diff=sum-target, win=diff===0;
    document.getElementById('status').textContent=win?(game.mode==='playing'?'정답! 🎉 다음 문제로 넘어가요':'정답이에요! 🎉'):(diff>0?'목표보다 '+diff+' 커요':'목표보다 '+(-diff)+' 작아요');
    document.getElementById('panel').className='panel'+(win?' win':'');
    var playing=game.mode==='playing';
    document.getElementById('add').disabled=n>=MAX||playing;
    document.getElementById('remove').disabled=n<=MIN||playing;
    document.getElementById('random').disabled=playing;
    document.getElementById('newTarget').disabled=playing;
    document.getElementById('start').textContent=playing?'그만하기':'게임 시작';
    document.getElementById('gProgress').textContent=playing?'문제 '+game.q+' / '+TOTAL:TOTAL+'문제에 도전해 보세요';
    checkWin(sum);
  }

  document.getElementById('add').addEventListener('click',function(){
    if(state.length>=MAX) return;
    state.unshift(0); build(); render();
  });
  document.getElementById('remove').addEventListener('click',function(){
    if(state.length<=MIN) return;
    state.shift();
    if(target>maxVal()) newTarget();
    build(); render();
  });
  document.getElementById('reset').addEventListener('click',function(){state=state.map(function(){return 0;});render();});
  document.getElementById('random').addEventListener('click',function(){
    state=state.map(function(){return Math.random()<.5?1:0;}); render();
  });
  document.getElementById('newTarget').addEventListener('click',function(){newTarget();render();});

  function fmt(ms){var s=ms/1000; return s>=60?Math.floor(s/60)+'분 '+(s%60).toFixed(1)+'초':s.toFixed(1)+'초';}
  function tick(){document.getElementById('gTime').textContent='⏱ '+fmt(performance.now()-game.t0);}
  function zero(){state=state.map(function(){return 0;});}

  function startGame(){
    clearInterval(game.timer);
    game.id++; game.mode='playing'; game.q=1; game.times=[]; game.locked=false;
    game.t0=game.qStart=performance.now();
    document.getElementById('app').className='';
    zero(); newTarget();
    game.timer=setInterval(tick,100);
    render(); tick();
  }
  function stopGame(){
    clearInterval(game.timer); game.id++; game.mode='idle'; game.locked=false;
    document.getElementById('gTime').textContent='⏱ 0.0초';
    render();
  }
  function finishGame(){
    clearInterval(game.timer); game.mode='done';
    var id=game.id, total=performance.now()-game.t0;
    document.getElementById('gTime').textContent='⏱ '+fmt(total);
    render();
    setTimeout(function(){
      if(game.id!==id||game.mode!=='done') return;
      document.getElementById('rtime').textContent=fmt(total);
      document.getElementById('rsub').textContent='문제별 시간: '+game.times.map(fmt).join(', ');
      document.getElementById('app').className='done';
      document.getElementById('again').focus();
    },900);
  }
  function checkWin(sum){
    if(game.mode!=='playing'||game.locked||sum!==target) return;
    game.locked=true;
    var now=performance.now(), id=game.id;
    game.times.push(now-game.qStart); game.qStart=now;
    if(game.q>=TOTAL){finishGame(); return;}
    setTimeout(function(){
      if(game.id!==id||game.mode!=='playing') return;
      game.q++; game.locked=false; zero(); newTarget(); render();
    },900);
  }
  document.getElementById('start').addEventListener('click',function(){
    if(game.mode==='playing') stopGame(); else startGame();
  });
  document.getElementById('again').addEventListener('click',startGame);

  newTarget(); build(); render();
})();
</script>
</body>
</html>
